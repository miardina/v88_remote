
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk V88-Remote.apk

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: V88-Remote-APK
          path: V88-Remote.apk
          if-no-files-found: error
          retention-days: 7
